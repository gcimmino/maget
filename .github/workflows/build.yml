name: build

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: maget-linux-amd64
            native: true

          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary: maget-darwin-amd64
            native: true

          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary: maget-darwin-arm64
            native: true

          - os: windows-latest
            goos: windows
            goarch: amd64
            binary: maget-windows-amd64.exe
            native: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - if: ${{ matrix.native }}
        run: go test ./...

      - if: ${{ matrix.native }}
        run: go vet ./...

      - run: go build -ldflags="-s -w" -o ${{ matrix.binary }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/maget-*
          generate_release_notes: true
